<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentmeter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f2a38;
      --text: #c8c8cc;
      --muted: #74777b;
      --faint: #59606a;
      --normal: #9290d2;
      --warning: #ae9559;
      --critical: #bd6974;
      --accent: #79999a;
      --good: #7ea6a7;
      --text-row: 1.45em;
      --chart-rows: 3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 13.2px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .shell { width: min(1680px, calc(100% - 36px)); margin: 0 auto; padding: 16px 0 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 14px; padding-right: 44px; }
    .brand { display: flex; align-items: baseline; gap: 2ch; }
    .mark { display: none; }
    h1 { margin: 0; font-size: 13.2px; letter-spacing: 0; }
    .subtitle { color: var(--muted); font-size: 11.44px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: 0; padding: 2px 0;
      background: transparent; color: var(--muted); font: inherit; font-size: 10.56px; cursor: pointer;
    }
    button::before { content: "["; } button::after { content: "]"; }
    button:hover { color: var(--text); }
    button.live { color: var(--normal); }
    button:disabled { opacity: .5; cursor: wait; }
    .chrome-toggle {
      position: fixed;
      top: max(4px, env(safe-area-inset-top));
      right: max(4px, env(safe-area-inset-right));
      z-index: 20;
      display: grid; place-items: center; width: 44px; height: 44px;
      padding: 0; border: 1px solid transparent; border-radius: 3px;
      background: transparent;
      color: var(--muted); opacity: .72;
      touch-action: manipulation; -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    }
    .chrome-toggle::before, .chrome-toggle::after { content: none; }
    .chrome-toggle:hover, .chrome-toggle:focus-visible { color: var(--text); border-color: var(--faint); opacity: 1; }
    .chrome-toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .chrome-toggle .hidden-mark { display: none; }
    .chrome-hidden .chrome-toggle .hidden-mark { display: block; }
    .chrome-hidden header, .chrome-hidden footer { display: none; }
    .chrome-hidden .shell {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding-block: 10px;
    }
    .chrome-hidden #panes { margin-block: auto; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10.56px; margin-right: 4px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
    .status-dot.busy { background: var(--warning); animation: pulse 1s infinite; }
    .status-dot.offline { background: var(--critical); }
    @keyframes pulse { 50% { opacity: .35; } }
    #panes { display: grid; grid-template-columns: repeat(var(--pane-count, 1), minmax(0, 1fr)); gap: 48px; }
    .pane { min-width: 0; }
    .pane-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 0 2px; }
    .pane-name { font-size: 15.84px; font-weight: 750; }
    .origin { color: var(--muted); font-size: 9.68px; text-align: right; }
    .loading { padding: 3em 0; color: var(--muted); }
    .meter { padding: 0 0 16px 2ch; }
    .meter-title { display: flex; align-items: baseline; gap: 2ch; min-height: var(--text-row); }
    .meter-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd1de; }
    .meter-name.active::before { content: "› "; color: var(--text); font-weight: 800; }
    .delta { color: var(--accent); }
    .bar { position: relative; height: var(--text-row); background: transparent; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--normal); transition: width .2s steps(8, end); }
    .bar-label { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text); }
    .warning .bar-fill { background: var(--warning); }
    .critical .bar-fill { background: var(--critical); }
    .time-bar { position: relative; height: var(--text-row); overflow: hidden; }
    .time-fill { height: 100%; background: var(--normal); transition: width .2s linear; }
    .time-left { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text); }
    .chart-wrap { margin-top: 0; }
    svg.area { display: block; width: 100%; height: calc(var(--text-row) * var(--chart-rows)); overflow: hidden; }
    .grid-line { stroke: var(--faint); stroke-width: 2; stroke-dasharray: 2 14; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .midnight-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .75; vector-effect: non-scaling-stroke; }
    .hour-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .55; vector-effect: non-scaling-stroke; }
    .area-fill { fill: rgba(121, 153, 154, .72); }
    .area-line { fill: none; stroke: var(--accent); stroke-width: 1; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .dot { fill: var(--normal); }
    .reset { display: block; min-height: var(--text-row); color: var(--muted); }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 2px; color: var(--muted); font-size: 9.68px; }
    .error-toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 10;
      width: max-content; max-width: min(680px, calc(100vw - 32px));
      transform: translate(-50%, 12px); padding: 9px 14px;
      border: 1px solid color-mix(in srgb, var(--critical) 65%, transparent);
      background: color-mix(in srgb, var(--bg) 90%, var(--critical));
      color: #f0c8ce; box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .15s ease, transform .15s ease, visibility 0s linear .15s;
      font-size: 10.56px; text-align: center;
    }
    .error-toast.visible {
      opacity: 1; visibility: visible; transform: translate(-50%, 0);
      transition-delay: 0s;
    }
    @media (max-width: 900px) {
      header { align-items: flex-start; flex-direction: column; gap: 4px; }
      .actions { justify-content: flex-start; }
    }
    @media (max-width: 600px) {
      #panes { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .shell { width: min(100% - 20px, 1680px); padding-top: 10px; }
      footer { flex-direction: column; gap: 4px; }
      .origin { display: none; }
    }
  </style>
</head>
<body>
  <button class="chrome-toggle" id="chrome-toggle" type="button" aria-label="상단과 하단 영역 숨기기" title="상단과 하단 영역 숨기기">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M2.5 10s2.8-4.5 7.5-4.5 7.5 4.5 7.5 4.5-2.8 4.5-7.5 4.5S2.5 10 2.5 10Z"></path>
      <circle cx="10" cy="10" r="2.2"></circle>
      <path class="hidden-mark" d="M3 3l14 14"></path>
    </svg>
  </button>
  <main class="shell">
    <header>
      <div>
        <div class="brand"><span class="mark"></span><h1>agentmeter</h1></div>
        <div class="subtitle" id="subtitle">usage windows · loading</div>
      </div>
      <div class="actions">
        <div class="status"><span class="status-dot busy" id="status-dot"></span><span id="status-text">connecting</span></div>
        <button id="refresh">Refresh</button>
        <button class="live" id="live-refresh">Live HTTP</button>
      </div>
    </header>
    <section id="panes" aria-live="polite">
      <div class="pane"><div class="loading">Loading usage data…</div></div>
    </section>
    <footer><span id="updated">Waiting for the first sample</span><span>self-hosted · local process</span></footer>
  </main>
  <div class="error-toast" id="error-toast" role="alert" aria-live="assertive"></div>
  <template id="pane-template">
    <article class="pane">
      <div class="pane-head"><span class="pane-name"></span><span class="origin"></span></div>
      <div class="meters"></div>
    </article>
  </template>
  <template id="meter-template">
    <section class="meter">
      <div class="meter-title"><span class="meter-name"></span><span class="delta"></span></div>
      <div class="bar"><div class="bar-fill"></div><span class="bar-label"></span></div>
      <div class="time-bar"><div class="time-fill"></div><span class="time-left" aria-live="off"></span></div>
      <div class="chart-wrap">
        <svg class="area" viewBox="0 0 1000 48" preserveAspectRatio="none" role="img" aria-label="Usage history area chart">
          <line class="grid-line" x1="0" y1="8" x2="1000" y2="8"></line>
          <line class="grid-line" x1="0" y1="24" x2="1000" y2="24"></line>
          <line class="grid-line" x1="0" y1="40" x2="1000" y2="40"></line>
          <path class="area-fill"></path><path class="area-line"></path>
        </svg>
      </div>
      <span class="reset"></span>
    </section>
  </template>
  <script>
    const panes = document.querySelector('#panes');
    const paneTemplate = document.querySelector('#pane-template');
    const meterTemplate = document.querySelector('#meter-template');
    const statusDot = document.querySelector('#status-dot');
    const statusText = document.querySelector('#status-text');
    const refreshButton = document.querySelector('#refresh');
    const liveButton = document.querySelector('#live-refresh');
    const chromeToggle = document.querySelector('#chrome-toggle');
    const errorToast = document.querySelector('#error-toast');
    let latest = null;
    let serverClockOffset = 0;
    let lastErrorSignature = '';
    let toastTimer = null;

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    function toggleChrome() {
      const hidden = document.body.classList.toggle('chrome-hidden');
      const label = hidden ? '상단과 하단 영역 보이기' : '상단과 하단 영역 숨기기';
      chromeToggle.setAttribute('aria-label', label);
      chromeToggle.title = label;
    }

    function showErrorToast(message) {
      clearTimeout(toastTimer);
      errorToast.textContent = message;
      errorToast.classList.add('visible');
      toastTimer = setTimeout(() => errorToast.classList.remove('visible'), 3000);
    }

    function remainingLabel(resetsAt) {
      let remaining = Math.max(0, Math.ceil(resetsAt - (Date.now() + serverClockOffset) / 1000));
      if (remaining === 0) return 'reset pending';
      const days = Math.floor(remaining / 86400); remaining %= 86400;
      const hours = Math.floor(remaining / 3600); remaining %= 3600;
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;
      const parts = [];
      if (days) parts.push(`${days} day`);
      if (days || hours) parts.push(`${hours} hour`);
      parts.push(`${minutes} minutes`, `${seconds} seconds`);
      return `${parts.join(' ')} left`;
    }

    function tickCountdowns() {
      const now = (Date.now() + serverClockOffset) / 1000;
      document.querySelectorAll('.time-bar[data-resets-at]').forEach(element => {
        const startedAt = Number(element.dataset.startedAt);
        const resetsAt = Number(element.dataset.resetsAt);
        const span = resetsAt - startedAt;
        const elapsed = span > 0 ? clamp((now - startedAt) / span, 0, 1) : 0;
        element.querySelector('.time-fill').style.width = `${elapsed * 100}%`;
        element.querySelector('.time-left').textContent = remainingLabel(resetsAt);
      });
    }

    function chart(svg, meter) {
      const fill = svg.querySelector('.area-fill');
      const line = svg.querySelector('.area-line');
      const projection = meter.chart || { area_path: '', line_path: '', markers: [] };
      svg.querySelectorAll('.midnight-line, .hour-line').forEach(marker => marker.remove());
      for (const projected of projection.markers || []) {
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        marker.setAttribute('class', projected.kind === 'midnight' ? 'midnight-line' : 'hour-line');
        marker.setAttribute('x1', projected.x); marker.setAttribute('x2', projected.x);
        marker.setAttribute('y1', 0); marker.setAttribute('y2', 48);
        svg.insertBefore(marker, line);
      }
      fill.setAttribute('d', projection.area_path || '');
      line.setAttribute('d', projection.line_path || '');
    }

    function renderMeter(meter) {
      const node = meterTemplate.content.firstElementChild.cloneNode(true);
      node.classList.add(meter.level);
      const name = node.querySelector('.meter-name');
      name.textContent = meter.title;
      if (meter.emphasized) name.classList.add('active');
      node.querySelector('.delta').textContent = meter.delta || '';
      node.querySelector('.bar-label').textContent = meter.label;
      node.querySelector('.bar-fill').style.width = `${clamp(meter.used_percent, 0, 100)}%`;
      const timeLeft = node.querySelector('.time-left');
      timeLeft.textContent = meter.window ? remainingLabel(meter.window.resets_at) : 'window unavailable';
      const timeBar = node.querySelector('.time-bar');
      if (meter.window) {
        timeBar.dataset.startedAt = meter.window.started_at;
        timeBar.dataset.resetsAt = meter.window.resets_at;
      }
      node.querySelector('.reset').textContent = meter.reset || '';
      chart(node.querySelector('svg'), meter);
      return node;
    }

    function render(data) {
      latest = data;
      const generatedAt = new Date(data.generated_at).getTime();
      if (Number.isFinite(generatedAt)) serverClockOffset = generatedAt - Date.now();
      panes.replaceChildren();
      panes.style.setProperty('--pane-count', Math.min(data.panes.length || 1, 2));
      for (const pane of data.panes) {
        const node = paneTemplate.content.firstElementChild.cloneNode(true);
        node.querySelector('.pane-name').textContent = pane.display;
        node.querySelector('.origin').textContent = pane.origin || 'waiting for data';
        const meters = node.querySelector('.meters');
        if (pane.meters.length) pane.meters.forEach(meter => meters.append(renderMeter(meter)));
        else meters.innerHTML = '<div class="loading">Loading usage data…</div>';
        panes.append(node);
      }
      const errors = data.panes
        .filter(pane => pane.error)
        .map(pane => `${pane.display}: ${pane.error}`);
      const errorSignature = errors.join('\n');
      if (errorSignature && errorSignature !== lastErrorSignature) showErrorToast(errors.join(' · '));
      lastErrorSignature = errorSignature;
      const hasClaude = data.panes.some(pane => pane.name === 'claude');
      liveButton.hidden = !hasClaude;
      statusDot.className = `status-dot${data.refreshing ? ' busy' : ''}`;
      statusText.textContent = data.refreshing ? 'refreshing' : 'live';
      document.querySelector('#subtitle').textContent = `usage windows · ${data.timezone}`;
      document.querySelector('#updated').textContent = `Rendered ${new Date(data.generated_at).toLocaleTimeString()}${data.next_refresh_at ? ` · next ${new Date(data.next_refresh_at).toLocaleTimeString()}` : ''}`;
      refreshButton.disabled = data.refreshing; liveButton.disabled = data.refreshing;
      tickCountdowns();
    }

    async function load() {
      try {
        const response = await fetch('/api/dashboard', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        statusDot.className = 'status-dot offline'; statusText.textContent = 'disconnected';
      }
    }

    async function refresh(live) {
      refreshButton.disabled = true; liveButton.disabled = true;
      statusDot.className = 'status-dot busy'; statusText.textContent = 'refreshing';
      try { await fetch(`/api/refresh?live=${live}`, { method: 'POST' }); } finally { await load(); }
    }
    refreshButton.addEventListener('click', () => refresh(false));
    liveButton.addEventListener('click', () => refresh(true));
    chromeToggle.addEventListener('click', toggleChrome);
    load(); setInterval(load, 2000); setInterval(tickCountdowns, 1000);
  </script>
</body>
</html>
