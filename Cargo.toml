[package]
name = "agentmeter"
version = "2026.8.2"
edition = "2024"
description = "코딩 에이전트의 사용 한도를 같은 형식으로 보여주는 CLI"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
iana-time-zone = "0.1.65"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2.2"
ureq = "3.4.0"

[dev-dependencies]
unicode-width = "0.2.2"

[lib]
name = "agentmeter"
path = "src/lib.rs"

[[bin]]
name = "agentmeter"
path = "src/bin/agentmeter.rs"
